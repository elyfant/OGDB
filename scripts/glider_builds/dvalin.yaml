# Dvalin's initial (purchase-time) build, from Fiona's primary-source notes.
# Copied from durin.yaml's structure (asset_types/positions) once that one
# was worked through end-to-end -- serial numbers cleared below for
# filling in from Dvalin's own records.
# Run with:
#   DATABASE_URL=postgresql://... python scripts/build_glider_assignments.py scripts/glider_builds/dvalin.yaml
#   DATABASE_URL=postgresql://... python scripts/build_glider_assignments.py scripts/glider_builds/dvalin.yaml --commit
#
# NOTE: assets.purchase_date for Dvalin (asset_id=12) is currently
# 2020-08-17 in the DB -- confirm this is the right start_date before
# running (Durin's DB value turned out to be 3 days off from the real
# date). Every component's start_date defaults to this value unless
# overridden per-component.
#
# NOTE: Dvalin's forward_section (asset 71, serial 560) and battery 94
# and payload bay 88 are currently still tangled in ambiguous legacy
# assignments claiming them for Dvalin/Urd -- see the "already has an
# OPEN assignment under a different parent" warnings this script prints.
# Don't assume Dvalin's real components match those legacy claims;
# fill this in from your own notes and let the warnings guide cleanup.

glider:
  asset_id: 12
  purchase_date: "2020-08-14"

components:
   - asset_type: slocum_forward_section
     serial_number: "559"
     notes: "Initial purchase-time forward section"
     detail: {model: "ASSY 305685-1000"}  # forward section



  # Add the rest of Durin's initial components below, one per physical
  # part. Copy/adjust this template — delete fields you don't need.
  #
   - asset_type: slocum_aft_section
     serial_number: "1016"
     detail: {model: "A311317-NFC"}

   - asset_type: slocum_energy_bay
     serial_number: "173"
     detail: {model: "306450-NFC"}     # energy bay

   - asset_type: slocum_end_cap
     serial_number: "165"
     detail: {model: "ASSY 305654"}    # end cap

   - asset_type: slocum_altimeter
     serial_number: "60247226"
     detail: {model: "G-1414"}           # altimeter

   - asset_type: slocum_hull
     serial_number: "2572"
     position: aft            # or fore / energy — hulls need a position
     detail: {hull_model_id: "1"}   # add once you have the length/part-number lookup
     create: true

   - asset_type: slocum_hull
     serial_number: "2560"
     position: fore            # or fore / energy — hulls need a position
     detail: {hull_model_id: "1"}   # add once you have the length/part-number lookup
     create: true

   - asset_type: battery
     serial_number: "87"
     position: pitch          # pitch / extended / aft

   - asset_type: battery
     serial_number: "81"
     position: aft          # pitch / extended / aft

   - asset_type: battery
     serial_number: "86"
     position: energy          # pitch / extended / aft

   - asset_type: ct_sensor
     serial_number: "9664"
     parent_ref: "1379"    # attaches to the payload bay below, not Durin directly

   - asset_type: slocum_payload_bay
     serial_number: "1379"
     detail: {model: "A311321-NFC"}    # payload bay

  # If a component genuinely isn't in OGDB yet at all (no legacy backfill
  # row), add `create: true` and whatever detail fields you know:
  #
   - asset_type: slocum_hull
     serial_number: "DVA-ex1"
     position: energy
     detail: {hull_model_id: "1"}   # add once hull_models has real rows
     create: true
