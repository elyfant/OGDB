# Curated NVS terms actually used by OGF equipment. Grow this list as
# real equipment models get matched against vocab.nerc.ac.uk, then run:
#   python scripts/sync_nvs_terms.py
#
# Deliberately curated, not a full collection mirror — L05/L22 together
# have 800+ terms, almost all irrelevant to gliders (plankton nets, ice
# profilers, ship codes...). Only add a term here once it's actually
# needed for a real sensor in the fleet.
#
# Currently wired into the schema: L05 (sensor_family) and L22 (model)
# on asset_sensor_details; P01 (measured parameter) on
# asset_sensor_parameters, many-to-many since one sensor outputs several
# parameters; C19 (SeaVoX water-body gazetteer, the vocabulary CF/OG1
# `sea_name` draws on) on mission_sea_names, many-to-many; L06 (category)
# and B76 (model) on platforms. B76/L06 terms are seeded by the
# xxxx_nvs_back_platforms migration, not this manifest.
#
# Format:
# - uri: http://vocab.nerc.ac.uk/collection/L22/current/TOOL0942/
#   note: why this term is here (which equipment it matches)

- uri: http://vocab.nerc.ac.uk/collection/P01/current/TEMPPR01/
  note: Measured parameter for every ct_sensor (temperature channel)
- uri: http://vocab.nerc.ac.uk/collection/P01/current/CNDCST01/
  note: Measured parameter for every ct_sensor (conductivity channel)
- uri: http://vocab.nerc.ac.uk/collection/P01/current/DOXYZZ01/
  note: Measured parameter for every do_sensor
- uri: http://vocab.nerc.ac.uk/collection/P01/current/CPHLPR01/
  note: Measured parameter for every eco_sensor (chlorophyll fluorescence -- all three ECO models in the fleet are fluorometers, kept to this one parameter for now rather than mapping turbidity/backscatter separately per model)
- uri: http://vocab.nerc.ac.uk/collection/L22/current/TOOL0669/
  note: >-
    Sea-Bird SBE 41CP CTD -- best-fit match for the CT sensor on early
    (pre-GPCTD) Slocum gliders. Sea-Bird's own production records
    (service reports, temp/cond/pressure calibration certs) for these
    units never print a standard model name -- every report is
    white-labeled "Model Number: WEBB Glider" / "WEBB Glider
    Calibration Data" throughout, a custom OEM template built for
    Webb Research rather than a catalog part. TOOL0669 is inferred
    from sensor era and the pumped/self-contained design (matches the
    Argo-float-family conductivity formula in the certs), not from a
    cross-reference in the vendor paperwork itself -- record any
    asset using this term with a note flagging it as inferred, not
    vendor-confirmed.
- uri: http://vocab.nerc.ac.uk/collection/L22/current/TOOL1492/
  note: >-
    Sea-Bird Slocum Glider Payload CTD (GPCTD) -- the pumped GPCTD as
    fitted to Slocum gliders (the Slocum-specific term; TOOL1026 is the
    platform-agnostic GPCTD). Not the same as the Sea-Bird "CT Sail"
    (TOOL1188), which is the unpumped Seaglider CT sensor.
- uri: http://vocab.nerc.ac.uk/collection/L22/current/TOOL0215/
  note: >-
    WET Labs {Sea-Bird WETLabs} ECO FLNTU combined fluorometer and
    turbidity sensor. Matches sci_flntu_* on the early gliders (gna,
    snotra). Two ECO-FLNTU(RT)D variants also exist (TOOL1283, TOOL1531)
    if a specific unit turns out to be an RT model.
- uri: http://vocab.nerc.ac.uk/collection/L22/current/TOOL0836/
  note: >-
    Aanderaa 3830 oxygen optode -- used for the Aanderaa Oxygen Optode
    3835 (sci_oxy3835_* on gna, mission 28 onward). L22 has no distinct
    3835 term; the 3835 is the same sensor as the 3830 in a different
    bulkhead/end-cap for glider mounting. Inferred, not vendor-confirmed
    -- flag any asset using this term.
- uri: https://vocab.nerc.ac.uk/collection/L22/current/TOOL1239/
  note: >-
    Aanderaa 4831 oxygen optode (sci_oxy4_* on the later gliders). The
    plain 4831; the fast-foil 4831F is TOOL1240.
- uri: https://vocab.nerc.ac.uk/collection/L22/current/TOOL1312/
  note: >-
    WET Labs {Sea-Bird WETLabs} ECO Puck Triplet FLBBCD-SLC -- the
    Slocum-mount three-channel puck: chlorophyll fluorescence + optical
    backscatter + CDOM (sci_flbbcd_* on the fleet's three-channel ECO
    gliders).

# --- C19 sea areas (SeaVoX water-body gazetteer) -> mission_sea_names ---
# The recognised sea area(s) a mission's data covers, for the CF `sea_name`
# attribute. C19 is coarse (IHO-level): finer sub-regions the fleet works
# in -- Faroe-Shetland Channel, Lofoten Basin, individual fjords -- have no
# C19 term and are not represented here (decision pending on free text).
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9/
  note: Arctic Ocean (parent of the Nordic/Barents seas below)
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9_4/
  note: Barents Sea -- e.g. the legacy/Barents deployments
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9_6/
  note: Greenland Sea
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9_7/
  note: >-
    Norwegian Sea -- the fleet's main operating area (Svinoy, Gimsoy,
    Lofoten, Faroe sections all fall within it)
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9_8/
  note: Iceland Sea
- uri: http://vocab.nerc.ac.uk/collection/C19/current/9_12/
  note: Baffin Bay
- uri: http://vocab.nerc.ac.uk/collection/C19/current/FRAM/
  note: Fram Strait
- uri: http://vocab.nerc.ac.uk/collection/C19/current/3_1/
  note: Mediterranean Sea -- the BioSWOT deployment
- uri: http://vocab.nerc.ac.uk/collection/C19/current/10_1/
  note: Weddell Sea
