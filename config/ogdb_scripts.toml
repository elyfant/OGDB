# Environment configuration for the scripts in scripts/ (ingest, backfill,
# sync, etc).
#
# This is the committed default. To override on a particular machine -- a
# different OS, a different group's data mount, a personal DB connection --
# create `config/ogdb_scripts.local.toml` (gitignored) with just the keys you
# want to change; see config/ogdb_scripts.local.example.toml. Environment
# variables win over both files:
#   DATABASE_URL          -> [database].url
#   PROJECTS_ROOT         -> [paths].projects_root
#
# Loaded by scripts/settings.py::load_settings().

[database]
# No working default is committed here (this repo is public) -- set your own
# in config/ogdb_scripts.local.toml or $DATABASE_URL, e.g.:
#   postgresql://<user>:<password>@localhost:<port>/ogdb
url = ""

[paths]
# Where the shared GFI projects folder is mounted on this machine. The Bergen
# facility default below is the Linux NFS mount -- Windows users and other
# groups override it in config/ogdb_scripts.local.toml or $PROJECTS_ROOT.
# File paths stored in OGDB (missions.l1_file / l2_file) are relative to this
# folder, e.g. naco/data/delayed/095-.../basestation/x.nc.
projects_root = "/Data/gfi/projects"

# The Seaglider per-mission data folders (<NNN>-<name>/), relative to
# projects_root. The same for everyone -- normally not overridden.
seaglider_data_dir = "naco/data/delayed"
