# Template for config/ogdb_scripts.local.toml (gitignored, per-machine).
# Copy this file to ogdb_scripts.local.toml and fill in only the keys you
# need to override -- anything you omit falls back to config/ogdb_scripts.toml.
# $DATABASE_URL / $PROJECTS_ROOT in the environment win over both
# files. See scripts/settings.py for the precedence.

[database]
# Local dev snapshot:
url = "postgresql://<user>:<password>@localhost:<port>/ogdb"

# Production, via an SSH tunnel (keep the tunnel open while you use it):
#   ssh -N -L 5555:localhost:5432 nrec_app &
# url = "postgresql://<user>@localhost:5555/ogdb"

[paths]
# Where the shared GFI projects folder (the one containing naco/ and slocum/)
# is mounted on this machine, e.g. a Windows drive letter:
# projects_root = "G:/gfi/projects"
